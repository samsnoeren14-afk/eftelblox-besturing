      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {

      width: 100%;
      padding: 24px;
      border: none;
      border-radius: 20px;
      background: #1db954;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="pagina">
    <h1>🎢 Eftelblox</h1>
    <h2>Danse Macabre</h2>

</html>
