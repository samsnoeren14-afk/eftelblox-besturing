<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eftelblox - LEGO Motortest</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 22px;
      margin-top: 14px;
      border: none;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    #verbindenKnop {
      background: #2563eb;
    }

    #motorKnop {
      background: #16a34a;
    }

    #stopKnop {
      background: #dc2626;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      margin-top: 22px;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      line-height: 1.6;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <h1>🎢 Eftelblox</h1>

    <h2>LEGO Motor Test</h2>

    <button id="verbindenKnop">
      🔗 VERBIND MET LEGO
    </button>

    <button id="motorKnop" disabled>
      ⚙️ TEST MOTOR A
    </button>

    <button id="stopKnop" disabled>
      🛑 STOP MOTOR
    </button>

    <div id="status">
      Klaar.
    </div>

  </div>

  <script>
    const verbindenKnop = document.getElementById("verbindenKnop");
    const motorKnop = document.getElementById("motorKnop");
    const stopKnop = document.getElementById("stopKnop");
    const status = document.getElementById("status");

    // Officiële LEGO Powered Up Bluetooth-services
    const LPF2_HUB_SERVICE =
      "00001623-1212-efde-1623-785feabcd123";

    const LPF2_HUB_CHARACTERISTIC =
      "00001624-1212-efde-1623-785feabcd123";

    let apparaat = null;
    let karakteristiek = null;

    // -----------------------------------------
    // VERBINDEN
    // -----------------------------------------

    verbindenKnop.addEventListener("click", async () => {

      try {

        status.textContent =
          "🔎 LEGO Powered Up zoeken...";

        apparaat = await navigator.bluetooth.requestDevice({
          filters: [
            {
              services: [LPF2_HUB_SERVICE]
            }
          ],
          optionalServices: [
            LPF2_HUB_SERVICE
          ]
        });

        status.innerHTML =
          "✅ Hub gevonden:<br>" +
          (apparaat.name || "Onbekende hub") +
          "<br><br>🔌 Verbinden...";

        const server = await apparaat.gatt.connect();

        const service =
          await server.getPrimaryService(LPF2_HUB_SERVICE);

        karakteristiek =
          await service.getCharacteristic(LPF2_HUB_CHARACTERISTIC);

        status.innerHTML =
          "🟢 <b>LEGO VERBONDEN!</b><br><br>" +
          "Hub: " +
          (apparaat.name || "Onbekend") +
          "<br><br>" +
          "Motor op poort A kan nu getest worden.";

        motorKnop.disabled = false;
        stopKnop.disabled = false;
        verbindenKnop.disabled = true;

      } catch (fout) {

        console.error(fout);

        status.innerHTML =
          "❌ Verbinden mislukt.<br><br>" +
          "<b>" +
          (fout.message || fout.name || "Onbekende fout") +
          "</b>";
      }

    });


    // -----------------------------------------
    // MOTORCOMMANDO
    // -----------------------------------------

    async function motor(power) {

      if (!karakteristiek) {
        status.textContent =
          "⚠️ Verbind eerst met de LEGO-hub.";
        return;
      }

      /*
        Powered Up:
        poort A = 0x00
        0x81 = output command
        0x11 = direct uitvoeren + feedback
        0x51 = WriteDirectModeData
        0x00 = motor power mode
        power = -100 t/m 100

        0 = vrij laten draaien
        127 = remmen
      */

      const pakket = new Uint8Array([
        0x08,
        0x00,
        0x81,
        0x00,
        0x11,
        0x51,
        0x00,
        power < 0 ? 256 + power : power
      ]);

      try {

        if (
          karakteristiek.properties.writeWithoutResponse
        ) {
          await karakteristiek.writeValueWithoutResponse(pakket);
        } else {
          await karakteristiek.writeValue(pakket);
        }

      } catch (fout) {

        console.error(fout);

        status.innerHTML =
          "❌ Motoropdracht mislukt.<br><br>" +
          (fout.message || fout.name || "Onbekende fout");
      }
    }


    // -----------------------------------------
    // TEST MOTOR
    // -----------------------------------------

    motorKnop.addEventListener("click", async () => {

      status.textContent =
        "⚙️ Motor A draait 1 seconde...";

      await motor(20);

      setTimeout(async () => {

        await motor(127);

        status.textContent =
          "✅ Motor A heeft 1 seconde gedraaid en is gestopt.";

      }, 1000);

    });


    // -----------------------------------------
    // STOP
    // -----------------------------------------

    stopKnop.addEventListener("click", async () => {

      await motor(127);

      status.textContent =
        "🛑 Motor A gestopt.";
    });

  </script>

</body>
</html>
