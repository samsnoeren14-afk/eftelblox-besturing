<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eftelblox LEGO Test</title>

  <script src="https://cdn.jsdelivr.net/npm/node-poweredup@latest/dist/browser/poweredup.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
    }

    button {
      width: 100%;
      padding: 24px;
      margin-top: 20px;
      border: none;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #2563eb;
    }

    #status {
      margin-top: 25px;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <h1>🎢 Eftelblox</h1>

    <h2>LEGO Bluetooth-test</h2>

    <button id="verbinden">
      🔗 VERBIND MET LEGO
    </button>

    <div id="status">
      Klaar.
    </div>

  </div>

  <script>
    const status = document.getElementById("status");
    const knop = document.getElementById("verbinden");

    if (!PoweredUP.isWebBluetooth) {
      status.textContent =
        "❌ Web Bluetooth wordt niet ondersteund.";
    }

    const poweredUP = new PoweredUP.PoweredUP();

    poweredUP.on("discover", async (hub) => {
      try {
        status.innerHTML =
          "✅ LEGO gevonden!<br><br>" +
          "Hub: " + (hub.name || "Onbekend") +
          "<br><br>🔌 Verbinden...";

        await hub.connect();

        status.innerHTML =
          "🟢 <b>VERBONDEN MET LEGO!</b><br><br>" +
          "Hub: " + (hub.name || "Onbekend");

      } catch (error) {
        status.innerHTML =
          "❌ Verbinden mislukt.<br><br>" +
          (error.message || error.name);
        console.error(error);
      }
    });

    knop.addEventListener("click", () => {
      try {
        status.textContent =
          "🔎 Bluetooth-keuzescherm openen...";

        poweredUP.scan();
      } catch (error) {
        status.innerHTML =
          "❌ Fout bij zoeken:<br><br>" +
          (error.message || error.name);
        console.error(error);
      }
    });
  </script>

</body>
</html>
