<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eftelblox - LEGO diagnose</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      width: 90%;
      max-width: 550px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
    }

    button {
      width: 100%;
      padding: 22px;
      margin-top: 15px;
      border: none;
      border-radius: 18px;
      font-size: 21px;
      font-weight: bold;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    #status {
      margin-top: 25px;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      text-align: left;
      line-height: 1.6;
      word-break: break-word;
    }

    .goed {
      color: #4ade80;
    }

    .fout {
      color: #f87171;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <h1>🎢 Eftelblox</h1>

    <h2>LEGO diagnose</h2>

    <button id="testKnop">
      🔍 TEST LEGO-HUB
    </button>

    <div id="status">
      Nog niet getest.
    </div>

  </div>

  <script>
    const testKnop = document.getElementById("testKnop");
    const status = document.getElementById("status");

    const HUB_SERVICE =
      "00001623-1212-efde-1623-785feabcd123";

    const BOOTLOADER_SERVICE =
      "00001625-1212-efde-1623-785feabcd123";

    testKnop.addEventListener("click", async () => {

      try {

        status.innerHTML = "🔎 LEGO-hub zoeken...";

        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            HUB_SERVICE,
            BOOTLOADER_SERVICE
          ]
        });

        status.innerHTML =
          "✅ Gevonden: <b>" +
          (device.name || "Onbekende hub") +
          "</b><br><br>" +
          "🔌 Verbinding maken...";

        const server = await device.gatt.connect();

        status.innerHTML =
          "🟢 Bluetooth verbonden.<br><br>" +
          "🔍 LEGO-services controleren...";

        const services = await server.getPrimaryServices();

        let gevonden = "";

        for (const service of services) {
          gevonden +=
            "<br>• " + service.uuid;
        }

        const heeftHubService =
          services.some(
            service =>
              service.uuid.toLowerCase() === HUB_SERVICE.toLowerCase()
          );

        const heeftBootloader =
          services.some(
            service =>
              service.uuid.toLowerCase() === BOOTLOADER_SERVICE.toLowerCase()
          );

        if (heeftHubService) {

          status.innerHTML =
            "<span class='goed'>✅ NORMALE LEGO HUB-SERVICE GEVONDEN!</span>" +
            "<br><br>" +
            "Dit is precies wat we nodig hebben." +
            "<br><br>" +
            "<b>Gevonden services:</b>" +
            gevonden;

        } else if (heeftBootloader) {

          status.innerHTML =
            "<span class='fout'>⚠️ BOOTLOADER-SERVICE GEVONDEN</span>" +
            "<br><br>" +
            "De hub lijkt niet in de normale Powered Up-modus te staan." +
            "<br><br>" +
            "<b>Gevonden services:</b>" +
            gevonden;

        } else {

          status.innerHTML =
            "<span class='fout'>❌ GEEN NORMALE LEGO HUB-SERVICE</span>" +
            "<br><br>" +
            "<b>Gevonden services:</b>" +
            gevonden;
        }

      } catch (error) {

        console.error(error);

        status.innerHTML =
          "<span class='fout'>❌ TEST MISLUKT</span>" +
          "<br><br>" +
          "<b>Fout:</b> " +
          (error.message || error.name || "onbekend");
      }

    });
  </script>

</body>
</html>
