<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eftelblox - LEGO Verbinding</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
    }

    h2 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 22px;
      margin-top: 15px;
      border: none;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    #legoKnop {
      background: #2563eb;
    }

    #status {
      margin-top: 25px;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <h1>🎢 Eftelblox</h1>
    <h2>Danse Macabre</h2>

    <button id="legoKnop">
      🔗 VERBIND MET LEGO
    </button>

    <div id="status">
      Nog niet verbonden.
    </div>
  </div>

  <script>
    const legoKnop = document.getElementById("legoKnop");
    const status = document.getElementById("status");

    let legoDevice = null;

    legoKnop.addEventListener("click", async () => {

      try {
        status.textContent = "🔎 LEGO-hub zoeken...";

        legoDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            "00001623-1212-efde-1623-785feabcd123"
          ]
        });

        status.textContent =
          "✅ LEGO gevonden: " +
          (legoDevice.name || "Onbekende hub") +
          "<br><br>🔌 Verbinding maken...";

        const server = await legoDevice.gatt.connect();

        status.textContent =
          "🟢 VERBONDEN MET LEGO!<br><br>" +
          "Hub: " +
          (legoDevice.name || "Onbekende hub");

        console.log("Bluetooth verbonden:", server);

        legoDevice.addEventListener(
          "gattserverdisconnected",
          () => {
            status.textContent = "🔴 LEGO-hub is losgekoppeld.";
          }
        );

      } catch (error) {

        console.error(error);

        status.innerHTML =
          "❌ Verbinding mislukt.<br><br>" +
          "Fout: " +
          (error.message || error.name);
      }

    });
  </script>

</body>
</html>
