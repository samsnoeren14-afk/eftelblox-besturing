<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eftelblox - LEGO test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 24px;
      margin-top: 15px;
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    #legoKnop {
      background: #2563eb;
    }

    #status {
      margin-top: 25px;
      padding: 15px;
      background: #222;
      border-radius: 12px;
      font-size: 18px;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <h1>🎢 Eftelblox</h1>
    <h2>Danse Macabre</h2>

    <button id="legoKnop">
      🔗 VERBIND MET LEGO
    </button>

    <div id="status">
      Nog niet verbonden.
    </div>

  </div>

  <script>
    const legoKnop = document.getElementById("legoKnop");
    const status = document.getElementById("status");

    let legoDevice = null;

    legoKnop.addEventListener("click", async () => {

      try {
        if (!navigator.bluetooth) {
          status.textContent =
            "❌ Deze browser ondersteunt Web Bluetooth niet.";
          return;
        }

        status.textContent =
          "🔎 LEGO Powered Up zoeken...";

        legoDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            "00001623-1212-efde-1623-785feabcd123"
          ]
        });

        status.textContent =
          "✅ LEGO gevonden: " +
          (legoDevice.name || "onbekende hub");

        legoDevice.addEventListener("gattserverdisconnected", () => {
          status.textContent = "🔴 LEGO is losgekoppeld.";
        });

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Er ging iets mis: " +
          (error.message || error.name);
      }

    });
  </script>

</body>
</html>
