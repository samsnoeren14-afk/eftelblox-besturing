<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eftelblox Test 13</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
    }

    h2 {
      font-size: 22px;
      color: #60a5fa;
    }

    button {
      width: 100%;
      padding: 22px;
      margin-top: 15px;
      border: none;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #2563eb;
    }

    #status {
      margin-top: 25px;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <h1>🎢 Eftelblox</h1>

    <h2>STAP 13 TEST</h2>

    <button id="legoKnop">
      🔗 TEST LEGO-VERBINDING
    </button>

    <div id="status">
      Nieuwe code geladen.
    </div>

  </div>

  <script>
    const legoKnop = document.getElementById("legoKnop");
    const status = document.getElementById("status");

    let legoDevice = null;

    legoKnop.addEventListener("click", async () => {

      try {

        status.textContent = "🔎 LEGO-hub zoeken...";

        legoDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            "00001623-1212-efde-1623-785feabcd123"
          ]
        });

        status.textContent =
          "✅ LEGO gevonden: " +
          (legoDevice.name || "Onbekende hub") +
          "\n\n🔌 Nu echt verbinden...";

        await legoDevice.gatt.connect();

        status.textContent =
          "🟢 ECHT VERBONDEN MET LEGO!\n\n" +
          "Hub: " +
          (legoDevice.name || "Onbekende hub");

      } catch (error) {

        status.textContent =
          "❌ FOUT BIJ VERBINDEN\n\n" +
          "Naam: " +
          (error.name || "onbekend") +
          "\n\nMelding: " +
          (error.message || "geen melding");

        console.error(error);
      }

    });
  </script>

</body>
</html>
