<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eftelblox - LEGO</title>

  <!-- Node-PoweredUp voor LEGO Powered Up -->
  <script src="https://cdn.jsdelivr.net/npm/node-poweredup@10.0.0/dist/browser/poweredup.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pagina {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
    }

    h2 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 22px;
      margin-top: 15px;
      border: none;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      margin-top: 25px;
      padding: 18px;
      background: #222;
      border-radius: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <h1>🎢 Eftelblox</h1>

    <h2>Danse Macabre</h2>

    <button id="verbindenKnop">
      🔗 VERBIND MET LEGO
    </button>

    <div id="status">
      Nog niet verbonden.
    </div>

  </div>

  <script>
    const verbindenKnop = document.getElementById("verbindenKnop");
    const status = document.getElementById("status");

    const poweredUP = new PoweredUP.PoweredUP();

    let hub = null;

    // Controleer of de browser Web Bluetooth ondersteunt
    if (!PoweredUP.isWebBluetooth) {
      status.textContent =
        "❌ Deze browser ondersteunt Web Bluetooth niet.";
    }

    // Wanneer PoweredUp een hub vindt
    poweredUP.on("discover", async function(nieuweHub) {

      try {
        hub = nieuweHub;

        status.textContent =
          "✅ Hub gevonden: " +
          (hub.name || "Onbekende hub") +
          "<br><br>🔌 Verbinden...";

        await hub.connect();

        status.innerHTML =
          "🟢 <b>VERBONDEN MET LEGO!</b><br><br>" +
          "Hub: " +
          (hub.name || "Onbekende hub");

        verbindenKnop.disabled = true;

      } catch (error) {

        console.error(error);

        status.innerHTML =
          "❌ Verbinden mislukt.<br><br>" +
          (error.message || error.name || "Onbekende fout");
      }

    });

    // Start zoeken naar LEGO Powered Up-hubs
    verbindenKnop.addEventListener("click", function() {

      try {

        status.textContent =
          "🔎 LEGO Powered Up-hub zoeken...";

        poweredUP.scan();

      } catch (error) {

        console.error(error);

        status.innerHTML =
          "❌ Zoeken mislukt.<br><br>" +
          (error.message || error.name || "Onbekende fout");
      }

    });
  </script>

</body>
</html>
